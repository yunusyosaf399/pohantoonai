name: Flutter Analyze and Widget Tests

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # Existing style/deprecation lints are recorded but must not prevent
      # compilation and widget-test verification. Analyzer errors still fail CI.
      - name: Analyze Dart (errors blocking; existing lints reported)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget tests
        run: flutter test
