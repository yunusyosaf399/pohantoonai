name: Flutter Analyze and Widget Tests

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Record CI startup
        run: |
          echo "Flutter CI startup; runner=$RUNNER_OS; ref=$GITHUB_REF; sha=$GITHUB_SHA" | tee ci-start.log
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # Existing style/deprecation lints are recorded but must not prevent
      # compilation and widget-test verification. Analyzer errors still fail CI.
      - name: Analyze Dart (errors blocking; existing lints reported)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Widget tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
      - name: Upload short-lived Flutter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            ci-start.log
            analyze.log
            flutter-test.log
          if-no-files-found: error
          retention-days: 1
