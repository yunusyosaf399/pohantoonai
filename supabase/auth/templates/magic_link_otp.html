<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f1f7f7;color:#15313b;padding:24px">
  <main style="max-width:520px;margin:auto;background:#fff;border:1px solid #d9e6e7;border-radius:16px;padding:28px">
    <h1 style="font-size:24px;color:#087866">Pohantoon AI</h1>
    <h2>Your sign-in verification code</h2>
    <p>Use this one-time code to sign in:</p>
    <p style="font-size:32px;letter-spacing:6px;font-weight:bold;text-align:center;background:#eaf8f3;padding:18px">{{ .Token }}</p>
    <p>This code can only be used once. Never share it with anyone.</p>
  </main>
</body>
</html>
